<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA ESPORTS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#08110d;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{
 background:#12221a;
 padding:20px;
 border-bottom:2px solid #baff39;
}
h1,h2{color:#baff39}
p{color:#ccc;line-height:1.6}
section{
 max-width:600px;
 margin:25px auto;
 padding:20px;
}
.card{
 background:#14251b;
 padding:22px;
 border:1px solid #345039;
 border-radius:14px;
 margin:15px 0;
}
input{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:1px solid #456047;
 border-radius:7px;
 background:#08110d;
 color:white;
}
.btn{
 display:inline-block;
 background:#baff39;
 color:#101510;
 padding:13px 20px;
 border:0;
 border-radius:8px;
 font-weight:bold;
 margin:8px;
 cursor:pointer;
}
.secondary{
 background:#263b2c;
 color:white;
}
.hidden{display:none}
#status{color:#baff39}
footer{
 padding:25px;
 background:#12221a;
 color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>NEXORA</h1>
<p>YOUR BATTLE. YOUR GLORY.</p>
</header>

<section>
<h2>PLAYER LOGIN</h2>

<div class="card" id="authBox">

<input id="email" type="email"
placeholder="Enter Email">

<input id="password" type="password"
placeholder="Enter Password">

<button class="btn" id="signupBtn">
SIGN UP
</button>

<button class="btn" id="loginBtn">
LOGIN
</button>

<button class="btn secondary" id="googleBtn">
LOGIN WITH GOOGLE
</button>

</div>

<div class="card hidden" id="profileBox">

<h2>PLAYER PROFILE</h2>

<p id="userEmail"></p>

<input id="playerName"
placeholder="Player Name">

<input id="freeFireUid"
placeholder="Free Fire UID">

<input id="inGameName"
placeholder="In-game Name">

<button class="btn" id="saveBtn">
SAVE PROFILE
</button>

<p>Total Kills: <span id="kills">0</span></p>
<p>Total Matches: <span id="matches">0</span></p>

<button class="btn secondary" id="logoutBtn">
LOGOUT
</button>

</div>

<p id="status">Welcome to NEXORA!</p>

</section>

<footer>
<p>© 2026 NEXORA ESPORTS</p>
<p>YOUR BATTLE. YOUR GLORY.</p>
</footer>

<script type="module">

import { initializeApp }

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);

function message(text){
 $("status").textContent = text;
}

$("signupBtn").onclick = async () => {
 try{
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || password.length < 6){
   message("Enter email and password (minimum 6 characters).");
   return;
  }

  await createUserWithEmailAndPassword(
   auth,email,password
  );

  message("Account created successfully!");

 }catch(error){
  message(error.message);
 }
};

$("loginBtn").onclick = async () => {
 try{
  await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  message("Login successful!");

 }catch(error){
  message(error.message);
 }
};

$("googleBtn").onclick = async () => {
 try{
  await signInWithPopup(auth,provider);
  message("Google login successful!");

 }catch(error){
  message(error.message);
 }
};

onAuthStateChanged(auth, async user => {

 if(user){

  $("authBox").classList.add("hidden");
  $("profileBox").classList.remove("hidden");

  $("userEmail").textContent = user.email || "Google User";

  await loadProfile(user.uid);

 }else{

  $("authBox").classList.remove("hidden");
  $("profileBox").classList.add("hidden");

 }

});

async function loadProfile(uid){

 try{

  const snapshot = await get(
   ref(db,"players/" + uid)
  );

  if(snapshot.exists()){

   const data = snapshot.val();

   $("playerName").value = data.playerName || "";
   $("freeFireUid").value = data.freeFireUid || "";
   $("inGameName").value = data.inGameName || "";

   $("kills").textContent = data.totalKills ?? 0;
   $("matches").textContent = data.totalMatches ?? 0;

  }else{

   $("kills").textContent = 0;
   $("matches").textContent = 0;

  }

 }catch(error){

  message("Profile loading error: " + error.message);

 }

}
